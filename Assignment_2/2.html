<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async Weather Tracker - Lab Assignment</title>
    <style>
        /* CSS - Matching PDF UI EXACTLY */
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }

        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
            color: white;
            margin: 0;
            padding: 30px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container { width: 100%; max-width: 900px; }

        header h1 {
            text-align: center;
            font-size: 26px;
            margin-bottom: 30px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* Card Styling from PDF */
        .card {
            background-color: #ffffff;
            color: #333;
            padding: 20px;
            border-radius: 10px;
            min-height: 240px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        h3 { margin-top: 0; font-size: 15px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; color: #1e3a8a; }
        h4 { font-size: 13px; margin: 15px 0 10px 0; color: #64748b; }

        /* Search Section */
        .search-box { display: flex; gap: 8px; margin-bottom: 20px; }
        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        button#searchBtn {
            background-color: #e67e22; /* PDF Orange */
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        /* History Buttons */
        .history-btn {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            margin-right: 6px;
            margin-bottom: 6px;
            cursor: pointer;
        }

        /* Weather Info Table Styles */
        .weather-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #f8fafc;
            font-size: 14px;
        }
        .weather-row span:first-child { font-weight: 600; color: #475569; }
        .weather-row span:last-child { color: #1e293b; }

        /* Console Section */
        .console-card { width: 100%; min-height: 180px; }
        .console-log {
            background-color: #0f172a;
            color: #94a3b8;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Consolas', monospace;
            font-size: 13px;
            height: 140px;
            overflow-y: auto;
            border: 1px solid #334155;
        }

        /* Logic Log Colors */
        .log-sync { color: #ffffff; }
        .log-async { color: #38bdf8; font-weight: bold; }
        .log-micro { color: #fbbf24; }
        .log-macro { color: #f472b6; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>⛅ Async Weather Tracker</h1>
        </header>

        <div class="main-layout">
            <!-- Left: Search & History -->
            <div class="card">
                <h3>Search City</h3>
                <div class="search-box">
                    <input type="text" id="cityInput" placeholder="Enter city (e.g. Delhi)">
                    <button id="searchBtn">Search</button>
                </div>
                
                <div class="history-section">
                    <h4>Search History</h4>
                    <div id="historyList"></div>
                </div>
            </div>

            <!-- Right: Detailed Weather Info -->
            <div class="card" id="weatherDisplay">
                <h3>Weather Info</h3>
                <div id="weatherContent">
                    <p style="color: #94a3b8; font-size: 13px; text-align: center; margin-top: 50px;">
                        Waiting for search...
                    </p>
                </div>
            </div>
        </div>

        <!-- Event Loop Console -->
        <div class="card console-card">
            <h3>Console - Event Loop</h3>
            <div id="consoleLog" class="console-log"></div>
        </div>
    </div>

    <script>
        // 1. PREDEFINED DATA AS REQUESTED
        const predefinedWeather = {
            "delhi": { name: "Delhi, IN", max: "34°C", min: "24°C", humidity: "52%", air: "12 km/h" },
            "indore": { name: "Indore, IN", max: "31°C", min: "21°C", humidity: "48%", air: "10 km/h" },
            "mumbai": { name: "Mumbai, IN", max: "30°C", min: "26°C", humidity: "80%", air: "18 km/h" },
            "london": { name: "London, UK", max: "18°C", min: "11°C", humidity: "65%", air: "15 km/h" }
        };

        const cityInput = document.getElementById('cityInput');
        const searchBtn = document.getElementById('searchBtn');
        const historyList = document.getElementById('historyList');
        const weatherContent = document.getElementById('weatherContent');
        const consoleLog = document.getElementById('consoleLog');

        // Initialize Search History
        window.onload = () => {
            const history = JSON.parse(localStorage.getItem('searchHistory')) || ["Delhi", "Indore", "Mumbai", "London"];
            localStorage.setItem('searchHistory', JSON.stringify(history));
            renderHistory();
        };

        function addLog(msg, type) {
            const div = document.createElement('div');
            div.className = type;
            div.innerText = `🟦 ${msg}`;
            consoleLog.appendChild(div);
            consoleLog.scrollTop = consoleLog.scrollHeight;
        }

        // 2. ASYNC HANDLER (Requirement #2 & #5)
        async function getWeatherData(city) {
            const cityKey = city.toLowerCase().trim();
            consoleLog.innerHTML = ''; // Clear console
            
            // TRACKING EXECUTION ORDER (Event Loop Analysis)
            addLog("Sync Start", "log-sync");

            // Microtask
            Promise.resolve().then(() => addLog("Promise.then (Microtask)", "log-micro"));

            // Macrotask
            setTimeout(() => addLog("setTimeout (Macrotask)", "log-macro"), 0);

            addLog(`[ASYNC] Start fetching details for ${city}...`, "log-async");

            try {
                // Simulate a network delay to observe Async behavior
                await new Promise(resolve => setTimeout(resolve, 800));

                let data;
                // Check if city is predefined, otherwise "fetch" (Mock/Real)
                if (predefinedWeather[cityKey]) {
                    data = predefinedWeather[cityKey];
                } else {
                    // This handles the "Fetch API" requirement for unknown cities
                    const response = await fetch(`https://api.openweathermap.org/data/2.5/weather?q=${city}&units=metric&appid=8d90f23071379f824e8a4a589574889c`);
                    if (!response.ok) throw new Error("City not found");
                    const apiData = await response.json();
                    data = {
                        name: apiData.name,
                        max: apiData.main.temp_max + "°C",
                        min: apiData.main.temp_min + "°C",
                        humidity: apiData.main.humidity + "%",
                        air: apiData.wind.speed + " m/s"
                    };
                }

                displayWeather(data);
                updateHistory(city);
                addLog("[ASYNC] Data received successfully", "log-async");

            } catch (err) {
                weatherContent.innerHTML = `<p style="color:red; font-size:13px;">Error: ${err.message}</p>`;
                addLog(`[ERROR] ${err.message}`, "log-async");
            }

            addLog("Sync End", "log-sync");
        }

        function displayWeather(data) {
            weatherContent.innerHTML = `
                <div class="weather-row"><span>City</span> <span>${data.name}</span></div>
                <div class="weather-row"><span>Max Temperature</span> <span>${data.max}</span></div>
                <div class="weather-row"><span>Min Temperature</span> <span>${data.min}</span></div>
                <div class="weather-row"><span>Humidity</span> <span>${data.humidity}</span></div>
                <div class="weather-row"><span>Air (Wind Speed)</span> <span>${data.air}</span></div>
            `;
        }

        function updateHistory(city) {
            let history = JSON.parse(localStorage.getItem('searchHistory')) || [];
            if (!history.includes(city)) {
                history.unshift(city);
                if (history.length > 5) history.pop();
                localStorage.setItem('searchHistory', JSON.stringify(history));
                renderHistory();
            }
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('searchHistory')) || [];
            historyList.innerHTML = '';
            history.forEach(city => {
                const btn = document.createElement('button');
                btn.className = 'history-btn';
                btn.innerText = city;
                btn.onclick = () => getWeatherData(city);
                historyList.appendChild(btn);
            });
        }

        searchBtn.addEventListener('click', () => {
            if (cityInput.value) getWeatherData(cityInput.value);
        });
    </script>
</body>
</html>
