<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chintu Page</title>

    <style>
        #root {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        img {
            width: 100%;
            height: 400px;
            object-fit: contain; /* Added to keep images from stretching */
        }

        #root>div {
            padding: 10px 15px;
            border-radius: 10px;
            box-shadow: rgba(0, 0, 0, 0.25) 0px 54px 55px, rgba(0, 0, 0, 0.12) 0px -12px 30px, rgba(0, 0, 0, 0.12) 0px 4px 6px, rgba(0, 0, 0, 0.17) 0px 12px 13px, rgba(0, 0, 0, 0.09) 0px -3px 5px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        #root>div:hover {
            cursor: pointer;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            background-color: yellow;
            border: none;
            border-radius: 10px;
        }

        button:hover {
            background-color: orange;
            cursor: pointer;
        }

        /* Style for the Add to Cart button to make it stand out */
        .add-to-cart-btn {
            background-color: #2ecc71;
            color: white;
            font-weight: bold;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #f8f8f8;
            margin-bottom: 20px;
        }
    </style>
</head>

<body>
    <nav>
        <h2>Welcome to Chintu ka Page</h2>
        <!-- Link to the cart page -->
        <a href="cart.html"><button style="background-color: lightblue;">Go to Cart 🛒</button></a>
    </nav>

    <div id="root">
        <!-- All product/card come/append here -->
    </div>
</body>

</html>

<script>
    const api = "https://fakestoreapi.com/products";

    fetch(api)
        .then((res) => res.json())
        .then((data) => {
            console.log(data)
            displayCart(data);
        }).catch((err) => console.log(err))
        .finally(() => console.log("data fetch successfully"))


    function displayCart(arr) {
        arr.forEach((el) => {
            const box = document.createElement("div");

            const image = document.createElement("img");
            image.setAttribute("src", el.image);

            const title = document.createElement("h3");
            title.innerText = `Title: ${el.title.substring(0, 20)}...`

            const category = document.createElement("h4");
            category.innerText = `Category: ${el.category}`

            const description = document.createElement("p");
            description.innerText = `Description: ${el.description.substring(0, 50)}...`

            const price = document.createElement("button");
            price.innerText = `Price: $${el.price}`

            const rating = document.createElement("button");
            rating.innerText = `Rating: ${el.rating.rate}`

            // --- ADD TO CART FEATURE START ---
            
            // 1. Create the Add to Cart button
            const addBtn = document.createElement("button");
            addBtn.innerText = "Add to Cart";
            addBtn.classList.add("add-to-cart-btn");

            // 2. Attach click event
            addBtn.addEventListener("click", function() {
                // Get data from localStorage (or empty array if it's the first item)
                let cart = JSON.parse(localStorage.getItem("cart")) || [];
                
                // Add the current item to the array
                cart.push(el);
                
                // Save updated array back to localStorage
                localStorage.setItem("cart", JSON.stringify(cart));
                
                alert("Product added to cart!");
            });

            // --- ADD TO CART FEATURE END ---

            box.append(image, title, category, description, price, rating, addBtn);
            document.querySelector("#root").append(box)
        })
    }
</script>
