<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chintu Cart</title>
    <style>
        #root { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        img { width: 100%; height: 250px; object-fit: contain; }
        #root > div { padding: 15px; border-radius: 10px; box-shadow: rgba(0, 0, 0, 0.2); }
        .remove-btn { background-color: #ff4d4d; color: white; border: none; padding: 10px; cursor: pointer; border-radius: 5px; width: 100%; }
    </style>
</head>
<body>
    <div style="padding: 20px;">
        <a href="index.html">← Back to Shopping</a>
        <h2>Your Shopping Cart</h2>
    </div>

    <div id="root"></div>

    <script>
        // Step 1: Get the data
        let cartData = JSON.parse(localStorage.getItem("cart")) || [];
        const rootDiv = document.querySelector("#root");

        function displayCart(data) {
            rootDiv.innerHTML = ""; // Clear existing content

            if (data.length === 0) {
                rootDiv.innerHTML = "<h1>Your cart is empty!</h1>";
                return;
            }

            data.forEach((el, index) => {
                const box = document.createElement("div");

                const image = document.createElement("img");
                image.src = el.image;

                const title = document.createElement("h3");
                title.innerText = el.title;

                const price = document.createElement("p");
                price.innerText = `Price: $${el.price}`;

                // CREATE REMOVE BUTTON
                const removeBtn = document.createElement("button");
                removeBtn.innerText = "Remove Item";
                removeBtn.className = "remove-btn";

                removeBtn.addEventListener("click", function() {
                    // Remove item from the array using its index
                    data.splice(index, 1);
                    // Update LocalStorage
                    localStorage.setItem("cart", JSON.stringify(data));
                    // Re-draw the page
                    displayCart(data);
                    alert("Item removed from cart");
                });

                box.append(image, title, price, removeBtn);
                rootDiv.append(box);
            });
        }

        // Run the function on page load
        displayCart(cartData);
    </script>
</body>
</html>
